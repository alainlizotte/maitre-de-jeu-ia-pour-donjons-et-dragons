# Configuration D&D 3.5 — Maître du Jeu
# Copiez ce fichier en config.yaml et ajustez selon votre installation.

llm:
  # Backend : "llamacpp" (référence) ou "ollama"
  # ── llama.cpp ───────────────────────────────────────────
  # Local : http://localhost:8080/v1 — Docker : http://llamacpp:8080/v1
  backend: "llamacpp"
  base_url: "http://localhost:8080/v1"
  api_key: "none"              # llama.cpp n'exige pas de clé
  model: "gemma-4-E4B-it-Q4_0" # GGUF dans ./models/ (voir scripts/download_model.ps1)
  think: false                 # désactive le thinking (Gemma 4, Qwen3…)
  options: {}                  # llama.cpp gère ctx-size, KV cache, etc. via flags
                               # Docker (docker-compose.yml, service llamacpp) :
                               #   -ngl 99   : toutes les couches sur GPU
                               #   -c 32768  : ctx-size (= max_context_tokens)
                               #   -n 8192   : max tokens générés (= max_tokens)

  # ── Ollama (alternative) ────────────────────────────────
  # backend: "ollama"
  # base_url: "http://localhost:11434/v1"
  # api_key: "ollama"           # placeholder requis par le client OpenAI
  # model: "igorls/gemma-4-12B-it-qat-q4_0-unquantized-heretic:latest"
  # options:
  #   num_ctx: 60000
  #   top_k: 64

  temperature: 0.75
  top_p: 0.9
  presence_penalty: 0.3         # pénalise les tokens déjà présents — rester
                                # BAS (≤ 0.5) : à 1.0+ un petit modèle dégénère
                                # en boucles sans fin (tour MJ figé en réflexion)
  repetition_penalty: 1.05      # pénalité de répétition (1.0 = neutre)
  max_context_tokens: 32768   # llama.cpp : ctx-size (-c 32768, -ngl 99)
  max_tokens: 8192            # budget max de tokens générés par réponse (-n 8192)

  # Watchdogs anti-blocage du streaming (keep-alives SSE sans contenu).
  max_stream_seconds: 300      # durée TOTALE max d'une génération streamée
  stale_stream_seconds: 90     # max sans AUCUN token de contenu

  # Stratégie de function-calling.
  # "native"   : envoie le schéma JSON des tools au backend (support Gemma 4 limité).
  # "prompt"   : décrit les tools dans le system prompt + parsing structuré (plus robuste avec Gemma).
  # "auto"     : tente native, retombe sur prompt si le LLM simule.
  tool_mode: "prompt"

  # Détecte et corrige les « simulations » textuelles d'appels d'outils
  # (pattern *(Simulation de l'appel ...)* observé avec les petits modèles).
  detect_simulation: true
  max_tool_iterations: 6      # borne la boucle tool-call / responde

  # Déchargement du modèle après le tour du MJ :
  #   true  = comportement historique : la VRAM est libérée dès la fin du
  #           dernier tour (partage du GPU avec ComfyUI).
  #   false = le modèle reste chargé, puis est déchargé après
  #           `unload_delay_minutes` minutes d'inactivité. Pratique si de la
  #           RAM est ajoutée ou un meilleur GPU acheté : les tours
  #           consécutifs n'ont plus à recharger le modèle.
  unload_after_turn: true
  unload_delay_minutes: 5

server:
  host: "127.0.0.1"
  port: 8000
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:8000"]

paths:
  # Racine des données runtime (parties, fiches, caches, ChromaDB).
  data_dir: "./server/data"
  prompts_dir: "./server/prompts"
  sections_dir: "./server/prompts/sections"

game:
  default_title: "Partie D&D 3.5 — Côte des Épées"
  default_frame: "Côte des Épées (Faerûn)"
  max_history_events: 50
  max_recap_chars: 6000
  stream_to_clients: false     # réponses du MJ livrées EN BLOC ; passer à
                               # true pour afficher la narration token par
                               # token (streaming) au fil de la génération
  block_messages_during_think: false  # bloquer l'envoi de messages pendant que le MJ travaille

image:
  # Génération d'images via ComfyUI (monstres, salles, portraits).
  # Désactivé par défaut — activez si ComfyUI est installé et accessible.
  enabled: false
  # base_url: "http://comfyui:8188"   # Docker ; local : http://127.0.0.1:8188
  # Toggles PAR CATÉGORIE : chacun coupe la génération ET l'affichage de sa
  # galerie (onglet correspondant). Le bouton de la galerie en jeu est un
  # interrupteur MAÎTRE qui coupe les trois d'un coup (persisté dans
  # data/settings.json) ; ces clés config.yaml restent autoritaires.
  monstres_enabled: true     # portraits des monstres rencontrés
  salles_enabled: true       # illustrations des pièces de donjon
  scenes_enabled: true       # scènes marquantes (événements, PNJ…)
  # Génération des portraits PJ via ComfyUI (indépendante des catégories).
  portraits_enabled: true

rag:
  # Base de connaissances RAG (Phase 2). Désactivé par défaut ; passez à
  # `true` après avoir exécuté `py -m server.rag --ingest` une fois.
  enabled: false
  # Dossier racine du corpus à ingérer (.txt/.md OCR — déposez vos fichiers
  # dans knowledge_import/ à la racine du projet).
  source_dir: "./knowledge_import"
  # Persistance du vector store ChromaDB embarqué.
  persist_dir: "./server/data/chroma"
  # Serveur d'embeddings dédié llama.cpp (conteneur llamaembed, port hôte
  # 8081). Vide → retombe sur llm.base_url (inadapté : le chat gemma ne fait
  # pas d'embeddings).
  embedding_base_url: "http://localhost:8081/v1"
  embedding_model: "embeddinggemma"   # GGUF dans ./models-embed/ (alias --alias)
  chunk_size: 1500            # tokens cibles par chunk (cf. MANIFESTE_KNOWLEDGE_BASE)
  chunk_overlap: 200          # tokens de chevauchement entre chunks consécutifs
  top_k: 5                    # nombre d'extraits récupérés par requête
  query_max_tokens: 1500      # budget max injecté dans le system prompt
  # Filtrage par KB : `null` = interroge toutes les KB ; liste pour restreindre
  # (ex: ["KB1_Manuels_de_base"] pour les règles en combat uniquement).
  kb_filter: null
