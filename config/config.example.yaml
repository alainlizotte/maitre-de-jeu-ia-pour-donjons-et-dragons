# Configuration D&D 3.5 — Maître du Jeu
# Copiez ce fichier en config.yaml et ajustez selon votre installation.

llm:
  # Backend Ollama (endpoint OpenAI-compatible).
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"           # placeholder requis par le client OpenAI
  model: "gemma4:12b"          # Gemma 4 12B (votre choix)
  temperature: 0.75
  top_p: 0.9
  max_context_tokens: 8192    # Gemma 4 12B accepte jusqu'à 8192 native
  max_tokens: 8192            # budget max de tokens générés par réponse

  # Options natives transmises à Ollama via le champ `options` du payload
  # OpenAI-compatible. Permet de tuner le runtime sans modifier le code.
  # Valeurs calibrées par l'utilisateur pour Gemma 4 12B :
  options:
    num_ctx: 60000          # fenêtre de contexte large (tokens)
    top_k: 64               # sampling diversifié (meilleurs résultats observés)

  # Stratégie de function-calling.
  # "native"   : envoie le schéma JSON des tools à Ollama (support Gemma 4 limité).
  # "prompt"   : décrit les tools dans le system prompt + parsing structuré (plus robuste avec Gemma).
  # "auto"     : tente native, retombe sur prompt si le LLM simule.
  tool_mode: "prompt"

  # Détecte et corrige les « simulations » textuelles d'appels d'outils
  # (pattern *(Simulation de l'appel ...)* observé sous OpenWebUI).
  detect_simulation: true
  max_tool_iterations: 6      # borne la boucle tool-call / responde

  # Déchargement du modèle après le tour du MJ :
  #   true  = comportement historique : la VRAM est libérée dès la fin du
  #           dernier tour (partage du GPU avec ComfyUI).
  #   false = le modèle reste chargé, puis est déchargé après
  #           `unload_delay_minutes` minutes d'inactivité. Pratique si de la
  #           RAM est ajoutée ou un meilleur GPU acheté : les tours
  #           consécutifs n'ont plus à recharger le modèle.
  unload_after_turn: true
  unload_delay_minutes: 5

server:
  host: "127.0.0.1"
  port: 8000
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:8000"]

paths:
  # Racine des données runtime (parties, fiches, caches, ChromaDB).
  data_dir: "./server/data"
  prompts_dir: "./server/prompts"
  sections_dir: "./server/prompts/sections"

game:
  default_title: "Partie D&D 3.5 — Côte des Épées"
  default_frame: "Côte des Épées (Faerûn)"
  max_history_events: 50
  max_recap_chars: 6000
  stream_to_clients: true      # le MJ stream-token sa réponse aux joueurs
  block_messages_during_think: false  # bloquer l'envoi de messages pendant que le MJ travaille

image:
  # Génération d'images via ComfyUI (monstres, salles, portraits).
  # Désactivé par défaut — activez si ComfyUI est installé et accessible.
  enabled: false
  # base_url: "http://comfyui:8188"   # Docker ; local : http://127.0.0.1:8188

rag:
  # Base de connaissances RAG (Phase 2). Désactivé par défaut ; passez à
  # `true` après avoir exécuté `py -m server.rag --ingest` une fois.
  enabled: false
  # Dossier racine du corpus à ingérer (.txt/.md OCR — déposez vos fichiers
  # dans knowledge_import/ à la racine du projet).
  source_dir: "./knowledge_import"
  # Persistance du vector store ChromaDB embarqué.
  persist_dir: "./server/data/chroma"
  embedding_model: "nomic-embed-text"   # doit être `ollama pull` au préalable
  chunk_size: 1500            # tokens cibles par chunk (cf. MANIFESTE_KNOWLEDGE_BASE)
  chunk_overlap: 200          # tokens de chevauchement entre chunks consécutifs
  top_k: 5                    # nombre d'extraits récupérés par requête
  query_max_tokens: 1500      # budget max injecté dans le system prompt
  # Filtrage par KB : `null` = interroge les 3 KB ; liste pour restreindre
  # (ex: ["KB1_Manuels_de_base"] pour les règles en combat uniquement).
  kb_filter: null
