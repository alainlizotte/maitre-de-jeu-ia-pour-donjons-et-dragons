# docker-compose.yml â€” D&D 3.5 MaÃ®tre du Jeu
#
# DÃ©marrage (arriÃ¨re-plan, aucune fenÃªtre de terminal ouverte) :
#   docker compose up -d --build
#   # puis (premiÃ¨re fois seulement) peupler le RAG :
#   docker compose exec dnd35 python -m server.rag --ingest
#
# Port : l'hÃ´te Ã©coute sur 8123 (conteneur interne 8000). Pour changer :
#   set DND35_PORT=9000 && docker compose up -d
#   (ou crÃ©ez un fichier .env contenant DND35_PORT=9000)
#
# AccÃ¨s public : le port est publiÃ© sur toutes les interfaces (0.0.0.0) ;
# les joueurs hors LAN peuvent y accÃ©der en redirigeant le port 8123 de votre
# box/routeur vers cette machine, ou via un reverse proxy (Caddy/Nginx) avec
# HTTPS pour une exposition propre en domaine.
#
# llama.cpp (chat) et llamaembed (embeddings RAG) tournent dans des conteneurs
# dédiés sur le réseau openwebui-net ; dnd35 s'y connecte via
# `http://llamacpp:8080/v1` et `http://llamaembed:8080/v1`.
#
# ArrÃªt :
#   docker compose down               # garde les volumes
#   docker compose down -v            # supprime aussi le vector store ChromaDB

services:
  dnd35:
    build: .
    image: dnd35-mj:latest
    container_name: dnd35-mj
    ports:
      - "${DND35_PORT:-8123}:8000"
    environment:
      DND35_CONFIG: /app/config/config.yaml
      COMFYUI_BASE_URL: "http://host.docker.internal:8188"
    volumes:
      # Configuration (écrasée par l'utilisateur, pas dans l'image).
      - ./config:/app/config:ro
      # Cartes de référence (Faerûn, Outreterre, Toril) — ro, copiées au
      # démarrage vers server/data/cartes/ pour être servies sous /data/.
      - ./cartes:/app/cartes:ro
      # Données runtime (parties, fiches, images générées, ChromaDB).
      - ./server/data:/app/server/data
      # Corpus source RAG (knowledge_import/ local du projet).
      - ./knowledge_import:/app/data/knowledge_import:ro
    restart: unless-stopped
    depends_on:
      llamacpp:
        condition: service_healthy
      llamaembed:
        condition: service_healthy
    networks:
      - openwebui-net

  # â”€â”€ llama.cpp (backend LLM de référence) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Backend par défaut (llm.backend: "llamacpp" dans config/config.yaml).
  # Alternative : Ollama (voir le bloc commenté dans config.example.yaml).
  #
  # PrÃ©requis :
  #   1. TÃ©lÃ©charger les modÃ¨les dans ./models/ (voir scripts/download_model.ps1)
  #   2. Installer NVIDIA Container Toolkit (nvidia-container-toolkit)
  #   3. Avoir Docker Desktop avec support GPU (WSL2)
  #
  # Flags :
  #   -ngl 99           : toutes les couches sur GPU (modèle entier en VRAM)
  #   -c 32768          : taille du contexte (= max_context_tokens projet)
  #   -n 8192           : max tokens générés par réponse (= max_tokens projet)
  #   -ctk q8_0         : KV cache K en 8-bit
  #   -ctv q8_0         : KV cache V en 8-bit
  #   --jinja           : template Jinja natif Gemma 4
  #   --flash-attn on   : Flash Attention (réduit VRAM KV cache)
  #   --sleep-idle-seconds 300 : unload après 5 min d'inactivité
  #   --spec-type draft-mtp --spec-draft-n-max 4 : MTP (speculative decoding, ~1.6-2x plus rapide)
  #
  # ⚠️ VRAM MESURÉE (nvidia-smi, RTX 3060 Ti 8192 Mo) — et non estimée :
  #   poids Qwen3.5-9B-Q4_K_M-MTP (fichier 5,47 Go) ................... 5 601 Mo
  #   KV cache 32k q8_0 (qwen35 = hybride SSM/attention,
  #     full_attention_interval=4 → 9 couches K/V sur 33) ..............   576 Mo
  #   contexte CUDA + buffers compute/graph ...........................   246 Mo
  #   TOTAL modèle chargé ............................................. 6 423 Mo
  # → il ne reste que ~950 Mo : de quoi tenir le contexte CUDA, PAS un
  #   checkpoint SD. D'où `llm.unload_before_image: true` — le modèle est
  #   déchargé avant chaque génération ComfyUI, rechargé ~3 s après.
  # ⚠️ `-ngl 99` force l'offload TOTAL même quand le modèle ne tient pas
  #   (log « failed to fit params to free device memory: n_gpu_layers already
  #   set by user to 99, abort »). Baisser à `-ngl 33` si la VRAM manque.
  llamacpp:
    # 🚀 MTP (Multi-Token Prediction) : ACTIVÉ et vérifié en production sur
    # l'image officielle (le MTP est fusionné dans llama.cpp, PR 20533) —
    # plus besoin du fork « llamacpp-spark ». Preuve dans les logs :
    #   common_speculative_init_result: creating MTP draft context against…
    #   slot print_timing: draft acceptance = 0.98 (71 accepted / 72)
    # L'acceptance varie fortement selon le tour (0,18 sur un tour
    # tool-calling dense, 0,98 sur de la narration) : c'est normal.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    ports:
      - "8080:8080"
    environment:
      # 🚀 MTP Qwen (fusionné dans llama.cpp officiel, PR 20533) : propagé aux
      # instances chargées à la demande du router via les variables LLAMA_ARG_*.
      # Gain mesuré attendu : ~1,6-2x sur la vitesse de génération.
      LLAMA_ARG_SPEC_TYPE: draft-mtp
      LLAMA_ARG_SPEC_DRAFT_N_MAX: "4"
    volumes:
      - ./models:/models
    command: >
      --host 0.0.0.0
      --port 8080
      --models-dir /models
      --models-max 1
      -ngl 99
      -c 32768
      -n 2048
      -np 1
      -ctk q8_0
      -ctv q8_0
      --jinja
      --flash-attn on
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - openwebui-net

  # â”€â”€ llama.cpp embeddings (RAG) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Conteneur CPU dÃ©diÃ© aux embeddings du RAG (modÃ¨le embeddinggemma-300M
  # QAT Q4_0, ~265 Mo). Ne consomme AUCUNE VRAM et ne concurrence donc ni
  # gemma ni ComfyUI. Le RAG (server/rag/) l'interroge via /v1/embeddings.
  #
  # Flags :
  #   --embedding       : active l'endpoint /v1/embeddings (OpenAI-compatible)
  #   (pas de --pooling) : pooling lu depuis les mÃ©tadonnÃ©es GGUF gemma-embedding
  #   -c 4096 -np 1 -ub 4096 : 1 slot plein contexte (dÃ©faut: 4 slots de c/4),
  #                       ubatch â‰¥ taille des chunks RAG (jusqu'Ã  ~2500 tokens)
  #   --alias           : nom exposÃ© dans l'API (doit matcher rag.embedding_model)
  llamaembed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamaembed
    ports:
      # Port interne 8080 (exigÃ© par le HEALTHCHECK de l'image), publiÃ© en
      # 8081 cÃ´tÃ© hÃ´te pour ne pas collider avec le chat llamacpp.
      - "8081:8080"
    volumes:
      - ./models-embed:/models
    command: >
      -m /models/embeddinggemma-300M-qat-Q4_0.gguf
      --host 0.0.0.0
      --port 8080
      --embedding
      -c 4096
      -np 1
      -b 4096
      -ub 4096
      --alias embeddinggemma
    restart: unless-stopped
    networks:
      - openwebui-net

networks:
  openwebui-net:
    external: true
